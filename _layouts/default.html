---
layout: compress
---

<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  {% include head.html %}
  <body class="site">
    {% include header.html %}
    <div class="site-wrap">
      <div class="post p2 p-responsive wrap" role="main">
        <div class="measure">{{ content }}</div>
      </div>
    </div>

    {% include footer.html %}
    <script>
      /* Theme toggle: switches between light and dark and remembers the choice */
      (function () {
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;
        var root = document.documentElement;
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function current() {
          return root.getAttribute("data-theme") || (mq.matches ? "dark" : "light");
        }
        function label() {
          btn.setAttribute("aria-label", "Switch to " + (current() === "dark" ? "light" : "dark") + " theme");
        }
        btn.addEventListener("click", function () {
          var next = current() === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try { localStorage.setItem("theme", next); } catch (e) {}
          label();
        });
        mq.addEventListener("change", label);
        label();
      })();
    </script>
    <script>
      /* Make horizontally scrolling code blocks keyboard-reachable */
      document.querySelectorAll("pre").forEach(function (el) {
        if (el.scrollWidth > el.clientWidth) el.tabIndex = 0;
      });
      /* Pandas tables have a blank index header; give it a screen-reader label */
      document.querySelectorAll("th:empty").forEach(function (th) {
        th.innerHTML = '<span class="sr-only">Index</span>';
      });
    </script>
  </body>
</html>
