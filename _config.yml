######################################
## Site settings                    ##
######################################
title: Ryan Ward
email: wardyryan1@gmail.com
author: Ryan Ward
description: "A place for my thoughts and ideas."
lang: en
locale: en_AU
url: https://ryanward-io.github.io
baseurl: ""
date_format: "%-d %b %Y"

# Search console verification (rendered by jekyll-seo-tag when set)
google_site_verification:

######################################
## Optional features                ##
######################################
show_post_footers: True
show_social_icons: True
enable_mathjax: false

###################################
## Social icons                  ##
###################################
github_username: ryanward-io
linkedin_username: ryanward4

text:
  post:
    updated: "Updated"
    minute_read: "minute read"

############################################
## Build settings                         ##
############################################
markdown: kramdown
kramdown:
  math_engine: ~
permalink: /:year/:month/:day/:title/
sass:
  style: compressed
  # Theme still uses @import and darken(); silence until migrated to @use/color.adjust
  silence_deprecations: ["import", "color-functions", "global-builtin"]
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
exclude:
  - vendor
  - CLEANUP_NOTES.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - collections
  - projects/README.md
  - node_modules
  - .github

# Default share image for jekyll-seo-tag (og:image / twitter:image)
defaults:
  - scope:
      path: ""
    values:
      image: /images/ryan.jpg
      twitter:
        card: summary
