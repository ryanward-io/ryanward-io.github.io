# Cards on /projects/. Status is one of: live, building, planned, archived.
# Optional links: demo (live demo URL), repo (GitHub URL), post (blog post path).
- title: Advertising spend explorer
  status: live
  summary: An interactive regression walkthrough on the classic advertising dataset. Which channel should the next dollar go to, and how well can different models predict sales? Originally built in 2021; now Streamlit running entirely in your browser.
  tags: [regression, scikit-learn, Streamlit, stlite]
  demo: https://ryanward.dev/advertising-spend-explorer/
  repo: https://github.com/ryanward-io/advertising-spend-explorer

- title: Bank transaction categoriser
  status: live
  summary: Can a model learn spending categories from the text on a bank statement? A scikit-learn classifier scored on descriptions it has never seen, with a model comparison and a confusion matrix.
  tags: [classification, scikit-learn, evaluation, stlite]
  demo: https://ryanward.dev/bank-transaction-categoriser/
  repo: https://github.com/ryanward-io/bank-transaction-categoriser

- title: LSTM forecasting
  status: planned
  summary: A small LSTM forecasting model trained offline and explored interactively in the browser.
  tags: [deep learning, time series]

- title: Ask my blog
  status: planned
  summary: Ask questions about my posts and get answers with citations. Retrieval over the blog, a small serverless backend and a language model, with an evaluation set so you can see how well it works.
  tags: [RAG, LLM, retrieval]

- title: JEV decision model
  status: planned
  summary: Trying a fast, typed "System One" model for routing and classification, measured against a small language model on speed, cost and accuracy.
  tags: [LLM, evaluation]

- title: Agentic workflow
  status: planned
  summary: A replayable trace of an agent working through a multi-step task, so you can follow each tool call and decision.
  tags: [agents, LLM]
