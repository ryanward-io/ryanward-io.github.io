<footer class="center">
  <div class="desktop-footer">
    <div class="footer-each">
      <p class="h5">
        <a href="https://www.google.com/maps/@-37.8487171,145.0252677,13z" target="_blank" rel="noopener">
          <span>Melbourne</span><br /><span>Australia</span>
        </a>
      </p>
    </div>
    <div class="footer-each">
      <p class="h5">
        <a href="mailto:{{ site.email }}">
          <span>{{ site.email | split: "@" | first }}</span><br />
          <span>@{{ site.email | split: "@" | last }}</span>
        </a>
      </p>
    </div>
    <div class="footer-each">
      <p class="h5">
        <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" target="_blank" rel="noopener"><span>LinkedIn</span></a>
      </p>
    </div>
    <div class="footer-each">
      <p class="h5">
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener"><span>Github</span></a>
      </p>
    </div>
  </div>
</footer>

{% if site.enable_anchorjs %}<!-- AnchorJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/3.0.0/anchor.min.js"></script>
<script>
  anchors.options.visible = "always";
  anchors.add("article h2, article h3, article h5, article h5, article h6");
</script>
{% endif %}
