######################################
## Site settings                    ##
######################################
title: Ryan Ward
email: wardyryan1@gmail.com
author: Ryan Ward
description: "A place for my thoughts and ideas."
url: https://ryanward-io.github.io
baseurl: ""
date_format: "%-d %b %Y"

# Google services
google_verification:
# Use either direct GA implementation or set up GTM account
# - using both will skew your data (leave blank to not use at all)
google_analytics:
google_tag_manager:

######################################
## Optional features                ##
######################################
show_post_footers: True
show_social_icons: True
enable_mathjax: false

###################################
## Social icons                  ##
###################################
github_username: ryanward-io
linkedin_username: ryanward4

###################################
## Post sharing icons            ##
###################################

text:
  share_buttons:
    text: "Share this post!"
    facebook: "Share on Facebook"
    twitter: "Share on Twitter"
    googleplus: "Share on Google+"
    linkedin: "Share on LinkedIn"
    digg: "Share on Digg"
    tumblr: "Share on Tumblr"
    reddit: "Share on Reddit"
    stumbleupon: "Share on StumbleUpon"
    hackernews: "Share on Hacker News"
  post:
    updated: "Updated"
    minute_read: "minute read"
    related_posts: "Related Posts"
  index:
    coming_soon: "Coming soon..."
  og_locale: "en_US"

############################################
## Build settings                         ##
############################################
markdown: kramdown
kramdown:
  math_engine: ~
permalink: /:year/:month/:day/:title/
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
exclude:
  - vendor
  - CLEANUP_NOTES.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - collections
  - projects/README.md
  - node_modules
  - .github
