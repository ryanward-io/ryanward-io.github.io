{% comment %}
  Interactive SVG chart. Usage: {% include chart.html src="/assets/charts/<post>/<name>.json" %}
  The JSON describes the chart (see assets/charts/chart.js). Styles and script load once per page.
{% endcomment %}
<figure class="ch" data-src="{{ include.src | relative_url }}">
  <noscript><p>This chart needs JavaScript.</p></noscript>
</figure>
{% unless chart_assets_loaded %}{% assign chart_assets_loaded = true %}
<style>
  .ch {
    --ch-fg: #111; --ch-muted: #555; --ch-grid: #e6e7ea; --ch-zero: #555; --ch-tip-bg: #fff; --ch-tip-border: #d6d9de;
    --ch-s1: #2a78d6; --ch-s2: #eb6834;
    margin: 1.75rem 0; color: var(--ch-fg);
  }
  :root[data-theme="dark"] .ch {
    --ch-fg: #e6e6e6; --ch-muted: #a3a8b0; --ch-grid: #262a31; --ch-zero: #a3a8b0; --ch-tip-bg: #1c1f25; --ch-tip-border: #2e323a;
    --ch-s1: #3987e5; --ch-s2: #d95926;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .ch {
      --ch-fg: #e6e6e6; --ch-muted: #a3a8b0; --ch-grid: #262a31; --ch-zero: #a3a8b0; --ch-tip-bg: #1c1f25; --ch-tip-border: #2e323a;
      --ch-s1: #3987e5; --ch-s2: #d95926;
    }
  }
  .ch-title { font-weight: 700; margin: 0 0 0.25rem; }
  .ch-legend { margin: 0 0 0.5rem; font-size: 0.85rem; color: var(--ch-muted); }
  .ch-legend-item { margin-right: 1rem; white-space: nowrap; }
  .ch-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 0.35rem; vertical-align: -1px; }
  .ch-swatch.ch-s1, .ch-bar.ch-s1, .ch-dot.ch-s1 { background: var(--ch-s1); fill: var(--ch-s1); }
  .ch-swatch.ch-s2, .ch-bar.ch-s2, .ch-dot.ch-s2 { background: var(--ch-s2); fill: var(--ch-s2); }
  .ch-wrap { position: relative; width: 100%; }
  .ch-wrap svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .ch-grid { stroke: var(--ch-grid); stroke-width: 1; }
  .ch-zero { stroke: var(--ch-zero); stroke-width: 1; }
  .ch-axis, .ch-val, .ch-mark-label { fill: var(--ch-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .ch-cat, .ch-direct, .ch-event-label { fill: var(--ch-fg); font-size: 12px; }
  .ch-event-label { font-size: 11px; fill: var(--ch-muted); }
  .ch-event { stroke: var(--ch-muted); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.7; }
  .ch-mark { stroke: var(--ch-s2); stroke-width: 2; }
  .ch-line { fill: none; stroke-width: 2; stroke-linejoin: round; }
  .ch-stroke1 { stroke: var(--ch-s1); } .ch-stroke2 { stroke: var(--ch-s2); }
  .ch-dot { stroke: var(--ch-tip-bg); stroke-width: 2; }
  .ch-cross { stroke: var(--ch-muted); stroke-width: 1; }
  .ch-tip {
    display: none; position: absolute; pointer-events: none; z-index: 2; max-width: 260px;
    background: var(--ch-tip-bg); border: 1px solid var(--ch-tip-border); border-radius: 6px;
    padding: 0.4rem 0.6rem; font-size: 0.8rem; line-height: 1.4; color: var(--ch-fg); box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .ch-muted { color: var(--ch-muted); }
  .ch-note { font-size: 0.8rem; color: var(--ch-muted); margin: 0.5rem 0 0; }
  .ch-data { font-size: 0.8rem; color: var(--ch-muted); margin-top: 0.25rem; }
  .ch-data summary { cursor: pointer; }
  .ch-data table { font-size: 0.8rem; margin-top: 0.5rem; }
</style>
<script src="{{ '/assets/charts/chart.js' | relative_url }}" defer></script>
{% endunless %}
