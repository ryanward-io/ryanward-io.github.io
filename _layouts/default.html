---
layout: compress
---

<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  {% include head.html %}
  <body class="site">
    {% include header.html %}
    <div class="site-wrap">
      <div class="post p2 p-responsive wrap" role="main">
        <div class="measure">{{ content }}</div>
      </div>
    </div>

    {% include footer.html %}
    <script>
      /* Make horizontally scrolling code blocks keyboard-reachable */
      document.querySelectorAll("pre").forEach(function (el) {
        if (el.scrollWidth > el.clientWidth) el.tabIndex = 0;
      });
    </script>
  </body>
</html>
