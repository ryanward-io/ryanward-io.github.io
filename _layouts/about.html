---
layout: default
---

<div style="text-align: center">
  <img
    style="border-radius: 10%; max-width: 250px"
    src="{{ page.headshot }}"
    alt="Ryan Ward headshot"
    width="250"
  />
</div>
<div class="post">
  <div class="post-header about-header">
    <h1 class="h2">{{ page.title }}</h1>
  </div>
  <article class="post-content">{{ content }}</article>
</div>
