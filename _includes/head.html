<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% seo %}
  <script>
    /* Apply a saved theme choice before first paint to avoid a flash */
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="alternate" type="application/atom+xml" title="Feed for {{ site.title }}" href="{{ '/feed.xml' | relative_url }}" />

  <!-- Theme CSS -->
  <link rel="stylesheet" href="{{ '/css/junior.css' | relative_url }}" type="text/css" />

  <link rel="preload" href="{{ '/fonts/muli-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />

  <!-- MathJax -->
  {% if site.enable_mathjax or page.mathjax == true %}
  <script>
    window.MathJax = { tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] } };
  </script>
  <script
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"
  ></script>
  {% endif %}

  <!-- Icons -->
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛺️</text></svg>"
  />
</head>
